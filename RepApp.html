<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.json">
<title>Cashbook — Sales</title>
<style>
:root{--ink:#14213d;--ink2:#4a5670;--paper:#f2f4f7;--line:#d3d9e3;--green:#0b7a53;--greenbg:#e3f3ec;--red:#b3261e;--redbg:#fbe9e7;--amber:#8a5a00;--amberbg:#fdf1d6}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;margin:0 0 .5rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:.6rem 1rem;min-height:44px}
button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}button.danger{background:var(--red);border-color:var(--red)}button.sm{min-height:34px;padding:.25rem .7rem;font-size:.9rem}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid #7aa7ff;outline-offset:1px}
input,select,textarea{width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:44px}
label{display:block;font-size:.88rem;color:var(--ink2);margin-bottom:.2rem}
header{background:var(--ink);color:#fff;padding:.6rem 1rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
header .co{font:700 1.1rem Charter,Georgia,serif;flex:1}
.pill{padding:.2rem .7rem;border-radius:99px;font-size:.85rem;background:#2d3b5f;color:#fff}.pill.on{background:var(--green)}.pill.warn{background:#a86b00}
nav{display:flex;gap:.3rem;overflow:auto;padding:.5rem .7rem;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{background:transparent;color:var(--ink);border:0;white-space:nowrap;min-height:40px}nav button.on{background:var(--ink);color:#fff}
main{max-width:980px;margin:0 auto;padding:1rem}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end}.row>*{flex:1 1 150px}.row>.fit{flex:0 0 auto}
.big{font:600 1.7rem Charter,Georgia,serif;font-variant-numeric:tabular-nums}
.muted,.hint{color:var(--ink2);font-size:.9rem}.neg{color:var(--red)}.pos{color:var(--green)}
table{border-collapse:collapse;width:100%}th,td{padding:.45rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:.82rem;color:var(--ink2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;padding:.05rem .5rem;border-radius:99px;font-size:.78rem;background:var(--amberbg);color:var(--amber)}.tag.g{background:var(--greenbg);color:var(--green)}.tag.r{background:var(--redbg);color:var(--red)}
.banner{padding:.7rem 1rem;border-radius:8px;margin-bottom:1rem;background:var(--amberbg);color:#5a3b00}.banner.r{background:var(--redbg);color:#7a1610}
.hit{display:flex;justify-content:space-between;gap:1rem;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:.3rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.7rem;padding-top:.7rem;border-top:1px solid var(--line)}.stats b{display:block;font:600 1.1rem Charter,Georgia,serif;font-variant-numeric:tabular-nums}.stats span{font-size:.82rem;color:var(--ink2)}.stats .spent b{color:var(--red)}
.total{font:600 1.5rem Charter,Georgia,serif;font-variant-numeric:tabular-nums}
.center{min-height:100vh;display:grid;place-items:center;padding:1rem}.center .card{width:100%;max-width:400px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:1rem;z-index:99;display:flex;flex-direction:column;gap:.4rem;align-items:center}
#toast div{background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:8px}#toast .err{background:var(--red)}
.overlay{position:fixed;inset:0;background:#0007;display:flex;justify-content:center;align-items:flex-start;padding:4vh 1rem;overflow:auto;z-index:40}.modal{background:#fff;border-radius:12px;padding:1.2rem;width:100%;max-width:460px}
#receipt{display:none}
@media print{body>*{display:none!important}#receipt{display:block!important;width:78mm;margin:0;font:12px/1.35 monospace;color:#000}#receipt table td,#receipt table th{border:0;padding:1px 0}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div><div id="receipt"></div>
<script>
/* ============================================================
   >>> OWNER: paste your web app link between the quotes below once, before copying this file to the reps' PCs.
   ============================================================ */
const DEFAULT_API_URL = '';

(function () {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// What belongs to the PC (server link, sign-in, PIN lock) is stored once. Everything a person produces (waiting entries, history,
// price list, counters, half-filled forms) is stored under that person's own name, so nobody ever sees another person's work.
let WHO = '';
const SCOPED = ['queue', 'hist', 'snap', 'lastSync', 'docseq', 'newseq', 'epoch', 'drafts'];
const skey = k => 'cb_' + (SCOPED.indexOf(k) >= 0 ? 'u_' + WHO + '_' : '') + k;
const LSget = (k, d) => { try { const v = localStorage.getItem(skey(k)); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const LSset = (k, v) => { try { localStorage.setItem(skey(k), JSON.stringify(v)); return true; } catch (e) { toast('This browser cannot store data. Do not close the app and tell your manager.', true); return false; } };
const whoOf = a => a && a.user && a.user.username ? String(a.user.username).toLowerCase().replace(/[^a-z0-9._-]/g, '') : '';
const uid = () => crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const pad = (n, l = 2) => String(n).padStart(l, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const weekStartStr = () => { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

try { const q = new URLSearchParams(location.search).get('api'); if (q && /^https:\/\/script\.google(usercontent)?\.com\//.test(q)) { localStorage.setItem('cb_api', JSON.stringify(q)); history.replaceState(null, '', location.pathname); } } catch (e) {}
const S = {
  api: LSget('api', '') || DEFAULT_API_URL, auth: LSget('auth', null), lock: LSget('lock', null), snap: null, queue: [], hist: [], lastSync: null, epoch: null,
  unlocked: false, needLogin: false, syncing: false, screen: 'home', unlockFails: 0
};
function loadMine() { WHO = whoOf(S.auth); S.snap = WHO ? LSget('snap', null) : null; S.queue = WHO ? LSget('queue', []) : []; S.hist = WHO ? LSget('hist', []) : []; S.lastSync = WHO ? LSget('lastSync', null) : null; S.epoch = WHO ? LSget('epoch', null) : null; DRAFT = WHO ? LSget('drafts', {}) : {}; }
let DRAFT = {};
(function migrateOldStorage() {            // version 1.1 kept everything in shared keys: hand it to whoever is signed in
  try { const u = whoOf(S.auth); if (!u) return;
    ['queue', 'hist', 'snap', 'lastSync', 'docseq', 'newseq'].forEach(k => { const old = localStorage.getItem('cb_' + k); if (old != null) { if (localStorage.getItem('cb_u_' + u + '_' + k) == null) localStorage.setItem('cb_u_' + u + '_' + k, old); localStorage.removeItem('cb_' + k); } });
  } catch (e) {}
})();
loadMine();
const persist = () => { LSset('queue', S.queue); LSset('hist', S.hist); LSset('snap', S.snap); LSset('lastSync', S.lastSync); LSset('epoch', S.epoch); LSset('auth', S.auth); };
const cur = () => (S.snap && S.snap.currency) || '₦';
const money = n => cur() + Number(n || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const qty = n => Number(n || 0).toLocaleString('en-US', {maximumFractionDigits: 4});
function toast(msg, err) { const t = document.createElement('div'); if (err) t.className = 'err'; t.textContent = msg; $('#toast').appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 2800); }

/* ---------- local PIN lock (convenience lock for shared PCs; the real security is the server login) ---------- */
async function lockHash(salt, pin) {
  const data = salt + ':' + pin;
  if (window.crypto && crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  let h = 5381; for (let i = 0; i < data.length; i++) h = ((h << 5) + h + data.charCodeAt(i)) | 0; return 'x' + h;
}

/* ---------- server calls ---------- */
async function call(action, data, ms) {
  if (!S.api) throw {code: 'CONFIG', message: 'The server link is not set. Open Settings and paste it, or ask your manager.'};
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), ms || 30000);
  try {
    const res = await fetch(S.api, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, redirect: 'follow', signal: ctrl.signal,
      body: JSON.stringify(Object.assign({action, token: S.auth && S.auth.token}, data || {}))});
    const j = await res.json();
    if (!j.ok) throw {code: j.code || 'SERVER', message: j.error || 'Server error'};
    return j.data;
  } catch (e) { if (e && e.code) throw e; throw {code: 'NET', message: 'Cannot reach the server (no internet?). Your entries are safe on this PC.'}; }
  finally { clearTimeout(t); }
}

async function sync(manual) {
  if (S.syncing || !S.auth) return;
  S.syncing = true; renderStatus();
  try {
    let guard = 0;
    do {
      const batch = S.queue.slice(0, 40);
      const data = await call('sync', {epoch: S.epoch || undefined, entries: batch.map(e => { const c = {}; Object.keys(e).forEach(k => { if (k[0] !== '_') c[k] = e[k]; }); return c; })});
      if (data.epochChanged) { handleReset(data.snapshot); break; }
      const done = {}; data.results.forEach(r => done[r.clientId] = r); const at = new Date().toISOString();
      batch.forEach(e => { const r = done[e.clientId]; if (!r) return;
        S.hist.unshift({clientId: e.clientId, type: e.type, label: e._label, amount: e._total, date: e.date, docNo: r.docNo || e.docNo, status: r.status === 'ERROR' ? 'REJECTED' : 'SYNCED', message: r.message || '', flags: r.flags || [], at, seen: r.status !== 'ERROR'}); });
      S.queue = S.queue.filter(e => !done[e.clientId]); S.hist = S.hist.slice(0, 300);
      S.snap = data.snapshot; S.epoch = data.snapshot.epoch || S.epoch; S.lastSync = at; persist();
      if (!Object.keys(done).length) break;
    } while (S.queue.length && ++guard < 30);
    S.needLogin = false;
    if (manual) toast('Synced');
  } catch (e) { if (e.code === 'AUTH') S.needLogin = true; if (manual || e.code === 'AUTH') toast(e.message, true); }
  S.syncing = false; softRefresh();
}
// The office wiped its data (factory reset). Entries still waiting here belong to the old books, so they are saved to a file and cleared.
function handleReset(snap) {
  const n = S.queue.length;
  if (n) { const blob = new Blob([JSON.stringify({note: 'Entries that had not synced when the office reset its data', savedAt: new Date().toISOString(), user: S.auth.user, entries: S.queue}, null, 1)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cashbook-before-reset-' + todayStr() + '.json'; a.click(); }
  S.queue = []; S.hist = []; S.snap = snap; S.epoch = snap.epoch; S.lastSync = new Date().toISOString(); persist();
  alert('The office has reset its records, so this app was refreshed.' + (n ? '\n\n' + n + ' entr' + (n > 1 ? 'ies' : 'y') + ' that had not been sent were saved to a file in your Downloads folder and removed. Give the file to your manager.' : ''));
}
const REFRESH_MS = 120000;   // while the app is open and online: send waiting entries and refresh prices, stock and totals about every 2 minutes
setInterval(() => { if (navigator.onLine && S.auth && !S.needLogin && S.unlocked && !document.hidden && (S.queue.length || !S.lastSync || Date.now() - Date.parse(S.lastSync) > REFRESH_MS - 5000)) sync(false); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && navigator.onLine && S.auth && S.unlocked && !S.needLogin && (!S.lastSync || Date.now() - Date.parse(S.lastSync) > 30000)) sync(false); });
window.addEventListener('online', () => { if (S.auth && S.unlocked) sync(false); });
window.addEventListener('offline', renderStatus);

/* ---------- helpers on local data ---------- */
function allProducts() {
  const base = S.snap ? S.snap.products : [], have = {}; base.forEach(p => have[p.sku] = true);
  const local = S.queue.filter(e => e.type === 'ADD_PRODUCT' && !have[e.sku]).map(e => ({sku: e.sku, name: e.name, category: e.category, unit: e.unit, price: e.price, type: e.kind, editable: e.kind === 'SERVICE' && !!e.priceEditable, stock: e.kind === 'SERVICE' ? null : 0, _local: true}));
  return base.concat(local);
}
const prod = sku => allProducts().find(p => p.sku === sku);
const isSvc = p => p && p.type === 'SERVICE';
const can = k => !!(S.snap && S.snap.permissions && S.snap.permissions.indexOf(k) >= 0);
const pending = () => S.queue.length;
function avail(sku) { const p = prod(sku); if (!p || isSvc(p)) return null; let q = p.stock || 0; S.queue.forEach(e => { if (e.type === 'SALE') e.items.forEach(i => { if (i.sku === sku) q -= i.qty; }); else if (e.type === 'STOCK_IN') e.items.forEach(i => { if (i.sku === sku) q += i.qty; }); }); return q; }
function custBalance(c) { let b = c.balance; S.queue.forEach(e => { if (e.partyId !== c.id) return; if (e.type === 'SALE') b += e._total - (e.amountPaid ?? e._total); else if (e.type === 'PAYMENT_IN') b -= e.amount; }); return b; }
function totalsFor(from) { const t = S.snap ? S.snap.totals : null; const o = {invoices: 0, qty: 0, revenue: 0, expenses: 0};
  const base = t ? (from === 'today' ? t.today : from === 'week' ? t.week : t.month) : o; Object.assign(o, base);
  const f = from === 'today' ? todayStr() : from === 'week' ? weekStartStr() : todayStr().slice(0, 8) + '01';
  S.queue.forEach(e => { if (e.date < f) return; if (e.type === 'SALE') { o.invoices++; o.qty += e._qty; o.revenue += e._total; } else if (e.type === 'EXPENSE') o.expenses += e.amount; }); return o; }
function nextDocNo() { const d = todayStr(), c = LSget('docseq', {d: '', n: 0}); const n = c.d === d ? c.n + 1 : 1; LSset('docseq', {d, n});
  const pre = (S.auth.user.username.replace(/[^A-Za-z0-9]/g, '').slice(0, 4) || 'REP').toUpperCase(); return `${pre}-${d.slice(2, 4)}${d.slice(5, 7)}${d.slice(8, 10)}-${pad(n, 3)}`; }
function enqueue(entry) { entry.clientId = uid(); entry.date = todayStr(); entry.at = new Date().toISOString(); entry._user = S.auth.user.username; S.queue.push(entry); persist(); setTimeout(() => { if (navigator.onLine) sync(false); }, 300); return entry; }

/* ---------- screens ---------- */
const tabs = () => [['home', 'Home'], ['sale', 'New sale'], ['pay', 'Customer payment'], ['exp', 'Expense']].concat(can('STOCK_IN') ? [['stockin', 'Receive stock']] : [], can('ADD_PRODUCT') ? [['newp', 'Add item / service']] : [], [['stock', 'Stock & prices'], ['cust', 'Customers'], ['hist', 'My entries'], ['set', 'Settings']]);
function render() {
  const app = $('#app');
  if (!S.auth) return loginScreen(app);
  if (S.lock && !S.unlocked) return unlockScreen(app);
  app.innerHTML = `<header><div class="co">${esc(S.snap ? S.snap.company : 'Cashbook')}${S.snap && S.snap.locationName && S.snap.locationName !== 'Main shop' ? ' · ' + esc(S.snap.locationName) : ''}</div><span id="who" class="pill">${esc(S.auth.user.fullName || S.auth.user.username)}</span><span id="st" class="pill"></span><button class="ghost sm" id="syncnow">Sync now</button></header>
  <nav id="nav"></nav><main id="main"><div id="banners"></div><div id="body"></div></main>`;
  $('#syncnow').onclick = () => sync(true); renderNav(); renderStatus(); renderBanners(); drawBody();
}
function renderNav() {
  const nav = $('#nav'); if (!nav) return;
  nav.innerHTML = tabs().map(t => `<button data-s="${t[0]}" class="${t[0] === S.screen ? 'on' : ''}">${t[1]}${t[0] === 'hist' && pending() ? ` (${pending()})` : ''}</button>`).join('');
  nav.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { S.screen = b.dataset.s; renderNav(); drawBody(); });
}
function renderBanners() {
  const el = $('#banners'); if (!el) return; const rej = S.hist.filter(h => h.status === 'REJECTED' && !h.seen).length;
  let top = '';
  if (S.needLogin) top += `<div class="banner r">Your login has expired. Your entries are safe on this PC. <button class="sm" id="relog">Sign in again</button></div>`;
  if (rej) top += `<div class="banner r">${rej} entr${rej > 1 ? 'ies were' : 'y was'} rejected by the office. Show them to your manager (see “My entries”).</div>`;
  el.innerHTML = top;
  const rl = $('#relog'); if (rl) rl.onclick = () => { S.auth = Object.assign({}, S.auth, {token: null}); loginScreen($('#app'), true); };
}
function drawBody() {
  const body = $('#body'); if (!body) return;
  ({home, sale: saleScreen, pay: payScreen, exp: expScreen, stockin: stockInScreen, newp: newProductScreen, stock: stockScreen, cust: custScreen, hist: histScreen, set: setScreen})[S.screen](body);
}
// After a background sync: update the badge, banners and only the screens that have nothing being typed into them.
// A form you are filling in (sale, payment, expense, receiving stock, new item) is never redrawn, so nothing you typed is lost.
function softRefresh() {
  if (!S.auth || (S.lock && !S.unlocked) || !$('#body')) { render(); return; }
  renderStatus(); renderBanners(); renderNav();
  const co = $('.co'); if (co && S.snap) co.textContent = S.snap.company + (S.snap.locationName && S.snap.locationName !== 'Main shop' ? ' · ' + S.snap.locationName : '');
  if (['home', 'hist', 'stock', 'cust'].indexOf(S.screen) < 0) return;
  const q = $('#q'), keep = q ? {v: q.value, focus: document.activeElement === q, pos: q.selectionStart} : null;
  drawBody();
  if (keep && $('#q')) { const nq = $('#q'); nq.value = keep.v; nq.dispatchEvent(new Event('input')); if (keep.focus) { nq.focus(); try { nq.setSelectionRange(keep.pos, keep.pos); } catch (e) {} } }
}
// Remember what is typed in the simple forms, so even switching tabs and coming back loses nothing.
function bindDraft(screen, ids) {
  const d = DRAFT[screen] || {};
  ids.forEach(id => { const el = document.getElementById(id); if (!el) return; if (d[id] !== undefined) el.value = d[id];
    el.addEventListener('input', () => { (DRAFT[screen] = DRAFT[screen] || {})[id] = el.value; LSset('drafts', DRAFT); }); });
}
function clearDraft(screen) { delete DRAFT[screen]; LSset('drafts', DRAFT); }
function renderStatus() {
  const st = $('#st'); if (!st) return; const on = navigator.onLine;
  st.className = 'pill ' + (S.syncing ? 'warn' : pending() ? 'warn' : on ? 'on' : ''); st.textContent = S.syncing ? 'Syncing…' : pending() ? pending() + ' waiting to sync' : on ? 'Online · all synced' : 'Offline · nothing waiting';
}

function loginScreen(app, relogin) {
  app.innerHTML = `<div class="center"><form class="card" id="lf"><h1>Cashbook</h1><p class="muted">${relogin ? 'Sign in again to keep syncing. Nothing you recorded is lost.' : 'First sign-in needs internet. After that the app works offline.'}</p>
  ${S.api ? '' : '<div style="margin-bottom:.8rem"><label>Server link (from your manager)</label><input name="api" required placeholder="https://script.google.com/macros/s/…/exec"></div>'}
  <div style="margin-bottom:.8rem"><label>Username</label><input name="u" autocomplete="username" required value="${esc(S.auth && S.auth.user ? S.auth.user.username : '')}"></div>
  <div style="margin-bottom:1rem"><label>PIN</label><input name="p" type="password" inputmode="numeric" autocomplete="current-password" required></div><button style="width:100%">Sign in</button></form></div>`;
  $('#lf').onsubmit = async e => { e.preventDefault(); const f = e.target, b = f.querySelector('button'); b.disabled = true;
    try {
      if (f.api) { S.api = f.api.value.trim(); LSset('api', S.api); }
      const u = f.u.value.trim();
      const others = waitingFromOthers(u);
      const d = await call('login', {username: u, pin: f.p.value, device: navigator.platform + ' · ' + (navigator.userAgent.match(/(Chrome|Edg|Firefox)\/[\d.]+/) || [''])[0]}, 30000);
      S.auth = {token: d.token, expiresAt: d.expiresAt, user: d.user}; LSset('auth', S.auth); loadMine();
      const salt = uid(); S.lock = {salt, hash: await lockHash(salt, f.p.value)}; LSset('lock', S.lock); S.unlocked = true; S.needLogin = false; persist();
      S.screen = 'home'; render(); if (others) toast(others, true); await sync(false);
    } catch (err) { toast(err.message || 'Could not sign in', true); b.disabled = false; } };
}
// Entries other people left waiting on this PC stay theirs: they are kept under their own name and are sent when they sign in.
function waitingFromOthers(me) {
  let lines = [];
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i), m = /^cb_u_(.+)_queue$/.exec(k || ''); if (!m || m[1] === me.toLowerCase().replace(/[^a-z0-9._-]/g, '')) continue; const q = JSON.parse(localStorage.getItem(k) || '[]'); if (q.length) lines.push(q.length + ' from ' + m[1]); } } catch (e) {}
  return lines.length ? 'Still waiting on this PC: ' + lines.join(', ') + '. They are kept private and are sent when that person signs in.' : '';
}
function unlockScreen(app) {
  app.innerHTML = `<div class="center"><form class="card" id="uf"><h1>Welcome back, ${esc(S.auth.user.fullName || S.auth.user.username)}</h1><p class="muted">Enter your PIN. Works offline.</p>
  <div style="margin-bottom:1rem"><input name="p" type="password" inputmode="numeric" autofocus autocomplete="off" placeholder="PIN"></div><button style="width:100%">Unlock</button>
  <p class="hint" style="margin-top:1rem"><a href="#" id="other">Not you? Sign in as someone else</a></p></form></div>`;
  $('#uf').onsubmit = async e => { e.preventDefault(); const pin = e.target.p.value;
    if ((await lockHash(S.lock.salt, pin)) === S.lock.hash) { S.unlocked = true; S.unlockFails = 0; render(); sync(false); }

  const sync_ = () => { const svc = $('#np-kind').value === 'SERVICE'; $('#np-re-w').style.display = svc ? 'none' : ''; $('#np-pe-w').style.display = svc ? '' : 'none'; $('#np-newcat-w').style.display = $('#np-cat').value === '__new' || !cats.length ? '' : 'none'; if ($('#np-unit').value === 'pc' && svc) $('#np-unit').value = 'job'; else if ($('#np-unit').value === 'job' && !svc) $('#np-unit').value = 'pc'; };
  bindDraft('newp', ['np-kind', 'np-name', 'np-cat', 'np-newcat', 'np-unit', 'np-price', 're-placeholder'].filter(x => x !== 're-placeholder').concat(['np-re'])); ['np-kind', 'np-cat'].forEach(id => $('#' + id).addEventListener('input', sync_)); sync_();
  $('#np-save').onclick = () => {
    const name = $('#np-name').value.trim(), cat = ($('#np-cat').value === '__new' || !cats.length) ? $('#np-newcat').value.trim() : $('#np-cat').value, price = +$('#np-price').value;
    if (!name) return toast('Enter a name.', true); if (!cat) return toast('Choose or type a category.', true); if (!($('#np-price').value !== '' && price >= 0)) return toast('Enter the selling price.', true);
    if (allProducts().some(p => p.name.trim().toLowerCase() === name.toLowerCase()) && !confirm('Something called “' + name + '” already exists. Add another one anyway?')) return;
    const c = LSget('newseq', 0) + 1; LSset('newseq', c);
    const pre = (S.auth.user.username.replace(/[^A-Za-z0-9]/g, '').slice(0, 4) || 'REP').toUpperCase(), kind = $('#np-kind').value;
    enqueue({type: 'ADD_PRODUCT', sku: `NEW-${pre}-${pad(c, 3)}`, name, category: cat, unit: $('#np-unit').value.trim() || (kind === 'SERVICE' ? 'job' : 'pc'), price, reorder: kind === 'ITEM' ? +$('#np-re').value || 0 : 0, kind, priceEditable: kind === 'SERVICE' && $('#np-pe').checked, _label: name, _total: price});
    clearDraft('newp'); toast('Saved. You can use it now.'); S.screen = kind === 'SERVICE' ? 'sale' : 'stockin'; if (!can('STOCK_IN') && kind === 'ITEM') S.screen = 'stock'; renderNav(); drawBody();
  };
}

function stockScreen(m) {
  m.innerHTML = `<h2>Stock & prices</h2><div class="card"><input id="q" placeholder="Search products…"><p class="hint">Quantities are as of the last sync, less sales waiting on this PC.</p><div id="t"></div></div>`;
  const draw = () => { const t = $('#q').value.toLowerCase(), r = allProducts().filter(p => (p.sku + p.name + p.category).toLowerCase().includes(t));
    $('#t').innerHTML = `<table><thead><tr><th>Product</th><th class="num">Price</th><th class="num">Available</th></tr></thead><tbody>${r.map(p => { const a = avail(p.sku); return `<tr><td>${esc(p.name)}${isSvc(p) ? ' <span class="tag g">service</span>' : ''}${p._local ? ' <span class="tag">new, not synced</span>' : ''}<div class="hint">${esc(p.sku)} · ${esc(p.category)}</div></td><td class="num">${p.editable ? 'per job' : money(p.price)}</td><td class="num ${a !== null && a <= 0 ? 'neg' : ''}">${a === null ? '—' : qty(a) + ' ' + esc(p.unit)}</td></tr>`; }).join('') || '<tr><td colspan="3" class="muted">Nothing found.</td></tr>'}</tbody></table>`; };
  $('#q').oninput = draw; draw();
}
function custScreen(m) {
  m.innerHTML = `<h2>Customers</h2><div class="card"><input id="q" placeholder="Search customers…"><div id="t"></div></div>`;
  const draw = () => { const t = $('#q').value.toLowerCase(), r = (S.snap ? S.snap.customers : []).filter(c => (c.name + c.phone).toLowerCase().includes(t));
    $('#t').innerHTML = `<table><thead><tr><th>Customer</th><th class="num">Owes</th></tr></thead><tbody>${r.map(c => `<tr><td>${esc(c.name)}<div class="hint">${esc(c.phone)}</div></td><td class="num ${custBalance(c) > 0 ? 'neg' : ''}">${money(custBalance(c))}</td></tr>`).join('') || '<tr><td colspan="2" class="muted">Nobody yet.</td></tr>'}</tbody></table>`; };
  $('#q').oninput = draw; draw();
}
function histScreen(m) {
  const lab = {SALE: 'Sale', EXPENSE: 'Expense', PAYMENT_IN: 'Payment', STOCK_IN: 'Stock received', ADD_PRODUCT: 'New item'};
  S.hist.forEach(h => { if (h.status === 'REJECTED') h.seen = true; }); LSset('hist', S.hist);
  m.innerHTML = `<h2>My entries</h2>${S.queue.length ? `<div class="card"><h3>Waiting to sync (${S.queue.length})</h3><table><tbody>${S.queue.slice().reverse().map(e => `<tr><td>${esc(e.date)}</td><td>${lab[e.type]}${e.docNo ? ' ' + esc(e.docNo) : ''}<div class="hint">${esc(e._label)}</div></td><td class="num">${money(e._total)}</td><td class="num"><button class="ghost sm" data-c="${esc(e.clientId)}">Cancel</button></td></tr>`).join('')}</tbody></table><p class="hint">You can cancel an entry only while it is still waiting. After it syncs, ask your manager to reverse it.</p></div>` : ''}
  <div class="card"><h3>Done</h3><table><tbody>${S.hist.slice(0, 100).map(h => `<tr><td>${esc(h.date)}</td><td>${lab[h.type] || h.type}${h.docNo ? ' ' + esc(h.docNo) : ''}<div class="hint">${esc(h.label)}</div>${h.status === 'REJECTED' ? `<div class="neg">${esc(h.message)}</div>` : ''}${(h.flags || []).length ? `<div class="hint">${esc(h.flags.join('; '))}</div>` : ''}</td><td class="num">${money(h.amount)}</td><td><span class="tag ${h.status === 'REJECTED' ? 'r' : 'g'}">${h.status === 'REJECTED' ? 'Rejected' : 'Synced'}</span></td></tr>`).join('') || '<tr><td class="muted">Nothing yet.</td></tr>'}</tbody></table></div>`;
  m.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { if (confirm('Cancel this entry?')) { S.queue = S.queue.filter(e => e.clientId !== b.dataset.c); persist(); render(); } });
}
function setScreen(m) {
  m.innerHTML = `<h2>Settings</h2><div class="card"><h3>Server link</h3><input id="api" value="${esc(S.api)}"><p style="margin-top:.6rem"><button class="ghost" id="sa">Save link</button></p></div>
  <div class="card"><h3>Change my PIN</h3><p class="hint">Needs internet.</p><div class="row"><div><label>Current PIN</label><input id="p0" type="password" inputmode="numeric"></div><div><label>New PIN (4+ digits)</label><input id="p1" type="password" inputmode="numeric"></div><div class="fit"><button id="cp">Change PIN</button></div></div></div>
  <div class="card"><h3>Safety copy</h3><p class="hint">Downloads everything waiting to sync, in case this PC has a problem. Give the file to your manager.</p><button class="ghost" id="bk">Download backup file</button></div>
  <div class="card"><h3>Sign out</h3><p class="hint">${pending() ? '<b class="neg">' + pending() + ' entries are still waiting to sync.</b> Connect to the internet and tap Sync now first.' : 'Everything is synced.'}</p><button class="danger" id="lo">Sign out</button></div>
  <p class="hint">Cashbook rep app · ${esc(S.auth.user.username)} · device date ${todayStr()} (check it is correct)</p>`;
  $('#sa').onclick = () => { S.api = $('#api').value.trim(); LSset('api', S.api); toast('Saved'); };
  $('#cp').onclick = async () => { try { await call('changePin', {oldPin: $('#p0').value, newPin: $('#p1').value}); const salt = uid(); S.lock = {salt, hash: await lockHash(salt, $('#p1').value)}; LSset('lock', S.lock); toast('PIN changed'); render(); } catch (e) { toast(e.message, true); } };
  $('#bk').onclick = () => { const blob = new Blob([JSON.stringify({exportedAt: new Date().toISOString(), user: S.auth.user, queue: S.queue, history: S.hist.slice(0, 100)}, null, 1)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cashbook-backup-' + todayStr() + '.json'; a.click(); };
  $('#lo').onclick = async () => { if (pending() && !confirm('You still have ' + pending() + ' unsynced entries. Signing out keeps them on this PC, but only YOU can post them. Sign out anyway?')) return;
    try { await call('logout', {}, 8000); } catch (e) {} persist(); S.auth = null; S.lock = null; S.unlocked = false; LSset('auth', null); LSset('lock', null); loadMine(); render(); };
}

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('beforeunload', e => { if (S.queue.length && S.unlocked) { e.preventDefault(); e.returnValue = ''; } });
if (S.auth && !S.lock) S.unlocked = true;
render();
})();
</script>
</body>
</html>
